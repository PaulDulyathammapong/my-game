<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจำเสียงดนตรี</title>
    
    <meta property="og:title" content="เกมจำเสียงดนตรี (Simon Game)" />
    <meta property="og:description" content="มาทดสอบความจำของคุณกัน!" />
    <meta property="og:url" content="https://paulai.site/game2.html" />
    
    <style>
        /* (CSS ทั้งหมดเหมือนเดิม) */
        body { font-family: 'Sarabun', sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .game-container { text-align: center; }
        h1 { font-size: 2.5em; margin-bottom: 20px; }
        .simon-pad { display: grid; grid-template-columns: 150px 150px; grid-template-rows: 150px 150px; gap: 20px; margin: 20px auto; }
        .simon-button { width: 150px; height: 150px; border-radius: 20px; border: 5px solid #000; cursor: pointer; opacity: 0.7; transition: opacity 0.1s ease, transform 0.1s ease; }
        .simon-button.active { opacity: 1; transform: scale(1.05); box-shadow: 0 0 20px #fff; }
        #green { background-color: #2ecc71; }
        #red { background-color: #e74c3c; }
        #yellow { background-color: #f1c40f; }
        #blue { background-color: #3498db; }
        #controls-container { margin-top: 20px; }
        #startButton, #shareButton { color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 10px; cursor: pointer; transition: background-color 0.3s; margin: 5px; }
        #startButton { background-color: #9b59b6; }
        #startButton:hover { background-color: #8e44ad; }
        #shareButton { background-color: #1877F2; }
        #shareButton:hover { background-color: #166FE5; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 id="level-title">กด "เริ่มเกม"</h1>
        <div class="simon-pad">
            <div class="simon-button" id="green" data-index="0"></div>
            <div class="simon-button" id="red" data-index="1"></div>
            <div class="simon-button" id="yellow" data-index="2"></div>
            <div class="simon-button" id="blue" data-index="3"></div>
        </div>
        
        <div id="controls-container">
            <button id="startButton">เริ่มเกม</button>
            <button id="shareButton" class="hidden">แชร์ไป Facebook</button>
        </div>
    </div>

    <script>
        // ที่อยู่ของ Backend ที่เราเพิ่งสร้าง
        const BACKEND_URL = 'https://my-game-production-d713.up.railway.app';
        
        // --- SCRIPT 1: (แทนที่) นับการเข้าชมหน้านี้ ---
        (function() {
            // ส่งสัญญาณ POST ไปบวกเลข 1 ครั้ง (ไม่ต้องรอผล)
            fetch(BACKEND_URL + '/increment?target=pageViews_game2', { method: 'POST' });
        })();
        // ======================================
    </script>
    
    <script>
        // --- ส่วน JavaScript ของเกม (เหมือนเดิม) ---
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const sounds = [261.63, 329.63, 392.00, 523.25];
        function playSound(index) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(sounds[index], audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.5);
        }
        const buttons = document.querySelectorAll('.simon-button');
        const startButton = document.getElementById('startButton');
        const levelTitle = document.getElementById('level-title');
        const shareButton = document.getElementById('shareButton');
        let gameSequence = [];
        let playerSequence = [];
        let level = 0;
        let isPlayerTurn = false;
        function startGame() {
            gameSequence = [];
            playerSequence = [];
            level = 0;
            startButton.classList.add('hidden');
            shareButton.classList.add('hidden');
            nextLevel();
        }
        function nextLevel() {
            isPlayerTurn = false;
            playerSequence = [];
            level++;
            levelTitle.textContent = `ด่านที่ ${level}`;
            const newColorIndex = Math.floor(Math.random() * 4);
            gameSequence.push(newColorIndex);
            playSequence();
        }
        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                if (i >= gameSequence.length) {
                    clearInterval(interval);
                    isPlayerTurn = true;
                    levelTitle.textContent = `ตาคุณ... (ด่าน ${level})`;
                    return;
                }
                flashButton(gameSequence[i]);
                i++;
            }, 800);
        }
        function flashButton(index) {
            const button = document.querySelector(`[data-index="${index}"]`);
            playSound(index);
            button.classList.add('active');
            setTimeout(() => {
                button.classList.remove('active');
            }, 400);
        }
        function handlePlayerClick(event) {
            if (!isPlayerTurn) return;
            const clickedIndex = parseInt(event.target.dataset.index);
            flashButton(clickedIndex);
            playerSequence.push(clickedIndex);
            checkAnswer(playerSequence.length - 1);
        }
        function checkAnswer(currentIndex) {
            if (playerSequence[currentIndex] !== gameSequence[currentIndex]) {
                gameOver();
                return;
            }
            if (playerSequence.length === gameSequence.length) {
                levelTitle.textContent = "ถูกต้อง! เยี่ยมมาก";
                isPlayerTurn = false;
                setTimeout(nextLevel, 1000);
            }
        }
        function gameOver() {
            playSound(1);
            playSound(0);
            levelTitle.innerHTML = `เกมโอเวอร์!<br>คุณทำได้ ${level - 1} ด่าน`;
            startButton.classList.remove('hidden');
            shareButton.classList.remove('hidden');
            startButton.textContent = "เล่นอีกครั้ง";
            isPlayerTurn = false;
        }
        
        // --- ฟังก์ชันแชร์ (แก้ไขเล็กน้อย) ---
        function shareToFacebook() {
            // === SCRIPT 2: (แทนที่) นับการแชร์ ===
            fetch(BACKEND_URL + '/increment?target=shareClicks', { method: 'POST' });
            // ======================================
            
            const urlToShare = 'https://paulai.site/game2.html';
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(urlToShare)}`, '_blank');
        }
        
        startButton.addEventListener('click', startGame);
        shareButton.addEventListener('click', shareToFacebook);
        buttons.forEach(button => {
            button.addEventListener('click', handlePlayerClick);
        });
    </script>
</body>
</html>
